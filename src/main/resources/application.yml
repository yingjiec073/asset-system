spring:
  application:
    name: asset-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-strong-secret-key-at-least-32-bytes}
    access-expire-seconds: ${JWT_ACCESS_EXPIRE_SECONDS:3600}
    refresh-expire-seconds: ${JWT_REFRESH_EXPIRE_SECONDS:604800}

rate-limit:
  requests: ${RATE_LIMIT_REQUESTS:120}
  window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
